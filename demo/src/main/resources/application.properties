spring.application.name=demo

# ── PostgreSQL ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/shopdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=Rahul@1234
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── JWT ───────────────────────────────────────────────────────────────────────
# Secret must be >= 32 characters (256 bits) for HS256 — change in production!
jwt.secret=shopAppJwtSecretKey2024PleaseChangeInProduction!
jwt.expirationMs=86400000

# ── Server ────────────────────────────────────────────────────────────────────
server.address=0.0.0.0
server.port=8080
server.tomcat.max-http-form-post-size=15MB
server.tomcat.max-swallow-size=15MB
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
